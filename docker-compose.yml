services:
  # 1. PostgreSQL with PostGIS and pgvector support
  postgres:
    image: postgis/postgis:16-3.4
    container_name: khojsetu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khojsetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for BullMQ Background Job Queue
  redis:
    image: redis:7-alpine
    container_name: khojsetu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO S3-Compatible Object Storage for Photos
  minio:
    image: minio/minio:latest
    container_name: khojsetu-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 4. Jaeger for OpenTelemetry Request and Worker Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: khojsetu-jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4318:4318"   # OTLP HTTP receiver

volumes:
  pgdata:
  redisdata:
  miniodata:
